<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>เกมลับของเรา 💕</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- 🔒 หน้าล็อกรหัส -->
  <div id="lock" class="card">
    <h2>🔒 ใส่รหัสลับ</h2>
    <input
      id="password"
      type="password"
      placeholder="รหัสของเรา 💕"
      onkeydown="if(event.key==='Enter') checkPassword()"
      style="width:100%;padding:12px;border-radius:10px;border:1px solid #ccc;"
    >
    <button onclick="checkPassword()">เข้าเกม</button>
    <p id="lockResult"></p>
  </div>

  <!-- 🎮 ตัวเกม (ซ่อนไว้ก่อน) -->
  <div class="card" id="game" style="display:none;">
    <h1 id="question">คำถามจะอยู่ตรงนี้</h1>
    <div id="choices"></div>
    <p id="result"></p>
  </div>

  <!-- 📜 โหลด JavaScript -->
  <script src="script.js"></script>
</body>
</html>
